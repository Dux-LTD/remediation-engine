<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalog Tagging</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--fg:#1c1c1a;--mute:#6d6b64;--line:#e3e0d7;--chip:#eef0f3;--acc:#2f5d8a;--acc-soft:#e6eef7;--eco:#2f7a4f;--eco-soft:#e5f2ea;--warn:#a4522a;--warn-soft:#f8ebe3;--ok:#2f7a4f;--pend:#8a6d1f;--on-acc:#fff;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151618;--panel:#1d1f22;--fg:#e9e7e2;--mute:#9c9a92;--line:#2d3034;--chip:#272a30;--acc:#86b1dd;--acc-soft:#22303f;--eco:#7fc79a;--eco-soft:#1f3328;--warn:#e0956a;--warn-soft:#3a281e;--ok:#7fc79a;--pend:#d8b85a;--on-acc:#10151b;--shadow:none}}
:root[data-theme="dark"]{--bg:#151618;--panel:#1d1f22;--fg:#e9e7e2;--mute:#9c9a92;--line:#2d3034;--chip:#272a30;--acc:#86b1dd;--acc-soft:#22303f;--eco:#7fc79a;--eco-soft:#1f3328;--warn:#e0956a;--warn-soft:#3a281e;--ok:#7fc79a;--pend:#d8b85a;--on-acc:#10151b;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acc)}
code{font:12.5px ui-monospace,Menlo,monospace;background:var(--chip);padding:0 4px;border-radius:3px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
.sub{color:var(--mute);font-size:12.5px}
.grow{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
nav{max-width:1180px;margin:0 auto;padding:8px 16px 0;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--mute);white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--acc);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
section{display:none}section.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.card b{display:block;font-size:22px;font-weight:650}
.card span{color:var(--mute);font-size:12.5px}
.callout{background:var(--acc-soft);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.callout b{color:var(--acc)}
h2{font-size:15px;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--chip)}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;border-radius:99px;padding:1px 8px;white-space:nowrap;font-weight:600}
.pill.done{background:var(--eco-soft);color:var(--ok)}.pill.todo{background:var(--chip);color:var(--mute)}.pill.you{background:var(--warn-soft);color:var(--warn)}.pill.hold{background:var(--chip);color:var(--pend)}
.chip{display:inline-block;font-size:12px;border-radius:5px;padding:1px 7px;margin:1px 2px 1px 0}
.chip.r{background:var(--acc-soft);color:var(--acc)}.chip.e{background:var(--eco-soft);color:var(--eco)}.chip.f{background:var(--warn-soft);color:var(--warn)}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input[type=search],select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;max-width:100%}
input[type=search]{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:68vh;overflow:auto}
.row{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--chip)}.row.sel{background:var(--acc-soft)}
.row .did{font:600 13px ui-monospace,Menlo,monospace;word-break:break-all}
.count{color:var(--mute);font-size:12.5px;margin:4px 2px 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:sticky;top:110px;max-height:78vh;overflow:auto}
@media (max-width:820px){.panel{position:static;max-height:none}}
.panel h3{margin:0 0 2px;font-size:16px;word-break:break-all}
.desc{color:var(--mute);margin:8px 0 12px}
.kv{margin:10px 0}
.bars div{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:2px 0}
.bars i{display:block;height:6px;border-radius:3px;background:var(--acc)}
.bars.e i{background:var(--eco)}
.bars span{min-width:130px}
.why{background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}
details summary{cursor:pointer;color:var(--acc);font-size:13px;margin:6px 0}
.cvelist{font-size:12.5px;max-height:220px;overflow:auto;columns:2;column-gap:18px}
@media (max-width:600px){.cvelist{columns:1}}
.muted{color:var(--mute)}
.noise{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.noise .card{padding:12px}
.nums{display:flex;gap:14px;margin:6px 0;font-size:12.5px}
.nums b{font-size:15px}
svg{display:block;width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.legend button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:2px 10px;font-size:12px}
.legend button.off{opacity:.35}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.empty{padding:30px;text-align:center;color:var(--mute)}
ol.dec li{margin:6px 0}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:6px}
.fstep{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.fstep .muted{font-size:12.5px;margin-top:2px}
.fnum{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:12px;font-weight:700}
ul.done{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 30px;margin:0 0 12px}ul.done li{margin:5px 0}
main details{margin:8px 0}
.thrbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--mute)}
.thrbar label{letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;font-weight:700}
.thrbar input[type=range]{flex:1;min-width:140px;max-width:300px;accent-color:var(--acc)}
.thrbar output{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700;min-width:34px}
.thrbar b{color:var(--fg)}
.gtool{display:flex;align-items:center;gap:6px;margin:6px 0}.gtool .ghost:disabled{opacity:.4;cursor:default}
.crumbs{font:12.5px ui-monospace,Menlo,monospace;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#relations{position:relative}
.gwrap{overflow:auto;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:grab;user-select:none;touch-action:none}
.gwrap.grabbing{cursor:grabbing}.gwrap svg{border:0;border-radius:0;max-width:none;display:block}
svg.hl .ge{opacity:.12}svg.hl .ge.on{opacity:1}svg.hl g[data-n]{opacity:.45}svg.hl g[data-n].on{opacity:1}
g[data-n] rect{transition:stroke .15s}g[data-n]:hover rect{stroke:var(--acc)}
.ge path{transition:opacity .15s}.ge.on path{stroke-width:3.5}
.gtip{display:none;position:absolute;z-index:4;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.18);pointer-events:auto}

/* label */
.lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.claim{font-size:18px;font-weight:650;margin:4px 0 10px;line-height:1.35}
.claim code{font-size:15px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media (max-width:600px){.recs{grid-template-columns:1fr}}
.rec{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px}
.rec b{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
.rec p{margin:6px 0 0;color:var(--mute);max-height:9em;overflow:auto}
.answers{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.answers button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px}
.answers button kbd{font:11px ui-monospace,Menlo,monospace;background:var(--chip);border-radius:4px;padding:1px 5px;margin-right:6px}
.answers button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.prog{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:6px 0 10px}.prog i{display:block;height:100%;background:var(--ok)}
.ev{font-size:12.5px;background:var(--eco-soft);border-radius:8px;padding:8px 10px;margin:8px 0}
/* pitch */
#pitch{max-width:980px;margin:0 auto}
.slide{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:18px}
.slide .kick{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.slide h2{font-size:24px;margin:6px 0 10px;line-height:1.25}
.slide p{margin:6px 0;max-width:70ch}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.big div{background:var(--bg);border-radius:10px;padding:14px}
.big b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.big span{color:var(--mute);font-size:13px}
.slide svg{border:0;background:transparent}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
@media (max-width:760px){.pipe{grid-template-columns:repeat(2,1fr)}}
.pipe div{background:var(--bg);border-radius:10px;padding:10px;font-size:12.5px;position:relative}
.pipe b{display:block;font-size:13.5px;margin-bottom:3px}
.pipe .n{color:var(--acc);font-weight:700;font-size:12px}
.end{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.end div{border-left:3px solid var(--acc);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13px}
.end b{display:block;margin-bottom:2px}
.road{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:12.5px}
.road span{padding:5px 10px;border-radius:99px;background:var(--chip)}
.road span.done{background:var(--eco-soft);color:var(--ok);font-weight:600}
.road span.now{background:var(--acc);color:var(--on-acc);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Catalog Tagging</h1>
    <span class="sub" id="snap"></span>
    <span class="grow"></span>
    <button class="ghost" id="theme" title="Toggle theme">◐</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <section id="roles"></section>
  <section id="records">
    <div class="split">
      <div>
        <div class="tools">
          <input type="search" id="q" placeholder="Search id, name or description">
          <select id="fr"></select><select id="fe"></select>
        </div>
        <div class="tools"><div class="seg" id="seg"></div></div>
        <div class="count" id="rcount"></div>
        <div class="list" id="rlist"></div>
      </div>
      <div class="panel" id="detail"><div class="empty">Pick a record on the left.</div></div>
    </div>
  </section>
  <section id="issues"></section>
  <section id="noise"></section>
</main>

const R=D.records, byId=Object.fromEntries(R.map(r=>[r.id,r]));

const md=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/~~([^~]+)~~/g,"<s>$1</s>").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
const store={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
/* ---------- tabs ---------- */
const TABS=[["roles","Roles"],["records","Records & tags"],["issues","Issues"],["noise","Category records"]];
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("");
// Every tab and opened record is a history entry (#tab or #tab/<uuid>), so the
// browser's Back/Forward — and a trackpad swipe — walk through what you looked at.
const nav=h=>{if(location.hash!==h)history.pushState(null,"",h)};
function show(t,push=true){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===t));tabsEl.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));store.set("tg.tab",t);if(push)nav("#"+t);scrollTo(0,0)}
tabsEl.onclick=e=>{const t=e.target.dataset.t;if(!t)return;show(t)};
document.getElementById("snap").textContent=`catalog snapshot ${D.snapshot} · ${R.length} approved software components`;
document.getElementById("theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.set("tg.theme",n)};
{const th=store.get("tg.theme",null);if(th)document.documentElement.dataset.theme=th}

/* ---------- roles ---------- */
(function roles(){
  const n=k=>R.filter(r=>r.role[0]===k).length;
  document.getElementById("roles").innerHTML=`<div class="tablewrap"><table><tr><th>Role</th><th>Definition (as Jev sees it)</th><th>Kind</th><th>Evidence · what a miss means</th><th>Command line shows it?</th><th>Records</th></tr>
  ${Object.entries(D.roles).map(([k,v])=>`<tr><td><a href="#" data-role="${k}"><span class="chip r">${k}</span></a></td><td style="font-size:13px">${esc(v)}</td><td><code>${esc(D.kind[k]||"–")}</code></td><td style="font-size:12.5px">${esc(D.evidence[k]||"")}</td><td style="font-size:12.5px">${md(D.cmdline[k]||"")}</td><td>${n(k)}</td></tr>`).join("")}</table></div>`;
})();

/* ---------- records ---------- */
let seg=store.get("tg.seg","all"), selected=null;
const SEGS=[["all","All"],["flag","Low confidence"]];
document.getElementById("seg").innerHTML=SEGS.map(([k,l])=>`<button data-s="${k}">${l}</button>`).join("");
const opt=(id,label,dict,key)=>{document.getElementById(id).innerHTML=`<option value="">${label}: any</option>`+Object.keys(dict).filter(k=>R.some(r=>r[key].includes(k))).map(k=>`<option value="${k}">${k} (${R.filter(r=>r[key].includes(k)).length})</option>`).join("")};
opt("fr","Role",D.roles,"role");opt("fe","Ecosystem",D.ecos,"eco");
const tagChips=r=>`<span class="lbl">role</span>${r.role.map(x=>`<span class="chip r" title="${esc(D.roles[x])}">${x}</span>`).join("")} <span class="lbl">eco</span>${r.eco.map(x=>`<span class="chip e" title="${esc(D.ecos[x])}">${x}</span>`).join("")}`;
function drawList(){
  const q=document.getElementById("q").value.toLowerCase(),fr=document.getElementById("fr").value,fe=document.getElementById("fe").value;
  const rows=R.filter(r=>(seg==="all"||(seg==="flag"&&r.flags.length))&&(!fr||r.role.includes(fr))&&(!fe||r.eco.includes(fe))&&(!q||(r.did+" "+r.name+" "+r.desc).toLowerCase().includes(q)));
  document.getElementById("rcount").textContent=`${rows.length} of ${R.length}`;
  document.getElementById("rlist").innerHTML=rows.slice(0,400).map(r=>`<div class="row ${r.id===selected?"sel":""}" data-id="${r.id}"><div class="did">${esc(r.did)}</div><div>${tagChips(r)}${r.flags.length?` <span class="chip f">${r.flags.length} flag${r.flags.length>1?"s":""}</span>`:""}</div></div>`).join("")+(rows.length>400?`<div class="empty">Showing 400 — narrow the search.</div>`:"")||`<div class="empty">Nothing matches.</div>`;
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.s===seg));
}
const bars=(a,cls)=>`<div class="bars ${cls}">${a.map(([k,v])=>`<div><span>${esc(k)}</span><i style="width:${Math.max(2,v*140)}px"></i>${v.toFixed(2)}</div>`).join("")}</div>`;
const cveList=r=>{const all=[...r.cf.map(c=>[c,"final"]),...r.cr.map(c=>[c,"draft"])];return all.length?`<details><summary>${r.cf.length} CVEs (final) · ${r.cr.length} draft</summary><div class="cvelist">${all.map(([c,k])=>`<div><a href="https://nvd.nist.gov/vuln/detail/${c}" target="_blank" rel="noopener">${c}</a>${k==="draft"?' <span class="muted">draft</span>':""}</div>`).join("")}</div></details>`:`<div class="muted" style="font-size:12.5px">No CVE prereqs use it.</div>`};
function detail(id,push=true){
  selected=id;if(push)nav("#records/"+id);const r=byId[id];
  document.getElementById("detail").innerHTML=`<h3>${esc(r.did)}</h3><div class="muted">${esc(r.name)}${r.vendor?" · "+esc(r.vendor):""}</div>
  <div class="desc">${esc(r.desc)}</div>
  <div class="kv">${tagChips(r)}${r.os.length?` <span class="lbl">os</span>${r.os.map(o=>`<span class="chip">${o}</span>`).join("")}`:""}</div>
  <div class="kv" style="font-size:13px"><span class="lbl">research-agent kind</span><code>${esc(r.kind||"not routed")}</code>${r.alt?` · <span class="lbl">or maybe</span><span class="chip r">${esc(r.alt)}</span>`:""}${r.prev?` · <span class="lbl">previous role</span><span class="muted">${esc(r.prev.join(", "))}</span>`:""}</div>
  <div class="muted" style="font-size:12.5px;margin:4px 0 8px"><b>${esc(r.role[0])}:</b> ${esc(D.roles[r.role[0]]||"")}</div>
  ${r.flags.length?`<div class="kv">${r.flags.map(f=>`<span class="chip f">${esc(f)}</span>`).join("")}</div>`:""}
  ${r.why?`<div class="why"><b>Why it is a category:</b> ${esc(r.why)}</div>`:""}
  <div class="kv"><span class="lbl">Jev role</span>${bars(r.jr,"")}<span class="lbl">Jev ecosystem</span>${bars(r.je,"e")}</div>
  <div class="kv"><span class="lbl">CVE usage</span>${cveList(r)}</div>`;
  drawList();
}
document.getElementById("rlist").onclick=e=>{const row=e.target.closest(".row");if(row)detail(row.dataset.id)};
document.getElementById("seg").onclick=e=>{if(e.target.dataset.s){seg=e.target.dataset.s;store.set("tg.seg",seg);drawList()}};
["q","fr","fe"].forEach(i=>document.getElementById(i).oninput=drawList);
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"),f=e.target.closest("[data-role]");if(g){e.preventDefault();show("records",false);detail(g.dataset.go)}if(f){e.preventDefault();document.getElementById("fr").value=f.dataset.role;show("records");drawList()}});
drawList();

  const val=v=>Array.isArray(v)?v.join(", "):String(v??"");
  document.getElementById("issues").innerHTML=`<div class="callout">Nothing here changes a tag by itself. A person decides; a pattern that repeats becomes a Jev instruction or a build rule.</div>
  <div class="cards"><div class="card"><b>${dup.length}</b><span>record problems (duplicates, merged products)</span></div><div class="card"><b>${dis.length}</b><span>reviewer disagrees with Jev</span></div><div class="card"><b>${low.length}</b><span>low-confidence tags</span></div></div>
  <details open><summary>Reviewer disagrees with Jev (${dis.length})</summary><div class="tablewrap"><table><tr><th>Record</th><th>Field</th><th>Jev</th><th>Reviewer</th><th>Why</th></tr>
  ${dis.map(f=>`<tr><td>${link(f.display_id)}</td><td>${esc(f.field)}</td><td><code>${esc(val(f.current))}</code></td><td><code>${esc(val(f.proposed))}</code></td><td style="font-size:12.5px">${esc(f.reason)}</td></tr>`).join("")}</table></div></details>
  <details><summary>Record problems — for the catalog owners (${dup.length})</summary><div class="tablewrap"><table><tr><th>Record</th><th>Problem</th></tr>
  ${dup.map(([d,t])=>`<tr><td>${link(d)}</td><td style="font-size:12.5px">${esc(t)}</td></tr>`).join("")}</table></div></details>
  <details><summary>Low-confidence tags (${low.length})</summary><div class="tablewrap"><table><tr><th>Record</th><th>Role</th><th>Why flagged</th></tr>
  ${low.map(r=>`<tr><td>${link(r.did)}</td><td><span class="chip r">${esc(r.role[0])}</span>${r.alt?` <span class="muted">or ${esc(r.alt)}</span>`:""}</td><td style="font-size:12.5px">${r.flags.map(esc).join("; ")}</td></tr>`).join("")}</table></div></details>`;
})();

/* ---------- noise ---------- */
(function noise(){
  const N=R.filter(r=>r.role.includes("category")).sort((a,b)=>(b.cf.length+b.cr.length)-(a.cf.length+a.cr.length));
  const unused=N.filter(r=>!r.cf.length&&!r.cr.length).length;
  document.getElementById("noise").innerHTML=`
  <div class="callout">${N.length} records tagged <code>category</code> · <b>${unused}</b> unused by any CVE prereq · ${N.length-unused} in use (removing those affects the system).</div>
  <div class="noise">${N.map(r=>`<div class="card"><div class="did" style="font:600 13px ui-monospace,Menlo,monospace;word-break:break-all"><a href="#" data-go="${r.id}">${esc(r.did)}</a></div>
  <div class="nums"><span><b>${r.cf.length}</b> CVEs final</span><span><b>${r.cr.length}</b> draft</span></div>
  <div style="font-size:13px">${esc(r.why||"")}</div>${cveList(r)}</div>`).join("")}</div>`;
})();

function applyHash(){
  const [t,id]=location.hash.slice(1).split("/");
  if(!TABS.some(x=>x[0]===t)){show(store.get("tg.tab","roles"),false);return}
  show(t,false);
  if(t==="records"&&byId[id])detail(id,false);
}
window.addEventListener("popstate",applyHash);
applyHash();
if(!location.hash)history.replaceState(null,"","#"+store.get("tg.tab","roles"));
</script>
